name: Exact-source PyBaMM 6037 main8ec paired readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-pybamm-6037-main8ec-paired-readiness
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'dhairyajangir/PyBaMM'
    name: ${{ matrix.profile }} fresh-native full gates
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: baseline-8ecfc4a3
            repository: pybamm-team/PyBaMM
            head: 8ecfc4a372a0dc9f2257359abaa40aa89cfb30b4
            tree: b4092ebf5d8b038aad18dc2150e42b6e53f1f511
          - profile: candidate-5033a965
            repository: dhairyajangir/PyBaMM
            head: 5033a965d1f420288e0ffe94b59eea36fda6a61d
            tree: eda313c287256c3a1a1e37f3f848232324257e5f
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      PROFILE: ${{ matrix.profile }}
      HELPER_WORKFLOW_REF: ${{ github.workflow_ref }}
      HELPER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      EXPECTED_HEAD: ${{ matrix.head }}
      EXPECTED_TREE: ${{ matrix.tree }}
      EXPECTED_NATIVE_TREE: 92e5498bd93d0942626429033ef00149d6b25f7d
      PYBAMM_DISABLE_TELEMETRY: 'true'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
      VTK_DEFAULT_OPENGL_WINDOW: vtkOSOpenGLRenderWindow
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Check out exact profile source and pinned native submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.head }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Assert source identity
        run: |
          export RECEIPTS="$RUNNER_TEMP/pybamm6037-main8ec-$PROFILE-readiness"
          export PYBAMM_SOLVER_WHEELS="$RUNNER_TEMP/pybamm6037-main8ec-$PROFILE-solver-wheels"
          export PRE_COMMIT_HOME="$RUNNER_TEMP/pybamm6037-main8ec-$PROFILE-pre-commit-cache"
          printf 'RECEIPTS=%s\nPYBAMM_SOLVER_WHEELS=%s\nPRE_COMMIT_HOME=%s\n' "$RECEIPTS" "$PYBAMM_SOLVER_WHEELS" "$PRE_COMMIT_HOME" >> "$GITHUB_ENV"
          mkdir -p "$RECEIPTS" "$PYBAMM_SOLVER_WHEELS" "$PRE_COMMIT_HOME"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD:packages/pybammsolvers)" = "$EXPECTED_NATIVE_TREE"
          git diff --exit-code HEAD --
          git ls-tree -r HEAD packages/pybammsolvers > "$RECEIPTS/native-source-manifest.txt"
          printf '%s\n' "$HELPER_WORKFLOW_REF" "$HELPER_WORKFLOW_SHA" > "$RECEIPTS/helper-workflow-identity.txt"
          uname -a > "$RECEIPTS/runner-kernel.txt"
          printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" > "$RECEIPTS/runner-image.txt"
          git rev-parse HEAD 'HEAD^{tree}' HEAD:packages/pybammsolvers > "$RECEIPTS/source-identity.txt"
          git submodule status --recursive | tee "$RECEIPTS/submodules.txt"
          if grep -qE '^[-+U]' "$RECEIPTS/submodules.txt"; then exit 1; fi
          date -u +%FT%TZ > "$RECEIPTS/started-at.txt"

      - name: Set up supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.4'
          enable-cache: false

      - name: Install maintained Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran gcc g++ make cmake libopenblas-dev graphviz pandoc libosmesa6 libegl1
          sudo apt-get install -y --no-install-recommends texlive-latex-extra dvipng
          sudo dot -c

      - name: Check lock and seed the locked build environment
        run: |
          uv --version | tee "$RECEIPTS/uv-version.txt"
          uv lock --check 2>&1 | tee "$RECEIPTS/lock-check.log"
          uv sync --frozen --python 3.13.18 --extra all --extra jax --group dev --group docs --no-install-package pybammsolvers 2>&1 | tee "$RECEIPTS/build-environment.log"
          uv run --no-sync --offline python --version | tee "$RECEIPTS/python-version.txt"

      - name: Build this checkout's solver wheel
        id: build
        run: |
          uv build --package pybammsolvers --python 3.13.18 --wheel --no-build-isolation --out-dir "$PYBAMM_SOLVER_WHEELS" 2>&1 | tee "$RECEIPTS/solver-build.log"
          test "$(find "$PYBAMM_SOLVER_WHEELS" -maxdepth 1 -name '*-cp313-*.whl' | wc -l)" -eq 1
          sha256sum "$PYBAMM_SOLVER_WHEELS"/*.whl > "$RECEIPTS/solver-wheel.sha256"
          find packages/pybammsolvers/build -name CMakeCache.txt -print0 | xargs -0 grep -F "CMAKE_HOME_DIRECTORY:INTERNAL=$GITHUB_WORKSPACE/packages/pybammsolvers" > "$RECEIPTS/native-cmake-source.txt"

      - name: Verify fresh native import and run the complete native package suite
        id: native_tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pybamm_wheels=("$PYBAMM_SOLVER_WHEELS"/*-cp313-*.whl)
          test "${#pybamm_wheels[@]}" -eq 1
          uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" --no-deps --force-reinstall "${pybamm_wheels[0]}" 2>&1 | tee "$RECEIPTS/native-install.log"
          uv run --no-sync --offline python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import zipfile
          from pybammsolvers import idaklu
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          expected_env = workspace / ".venv"
          assert Path(sys.prefix).resolve() == expected_env
          assert sys.version_info[:3] == (3, 13, 18)
          native = Path(idaklu.__file__).resolve()
          assert native.is_relative_to(expected_env)
          wheels = list(Path(os.environ["PYBAMM_SOLVER_WHEELS"]).glob("*-cp313-*.whl"))
          assert len(wheels) == 1
          sha = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(wheels[0]) as archive:
              members = [name for name in archive.namelist()
                         if name.startswith("pybammsolvers/") and name.endswith("/" + native.name)]
              assert len(members) == 1
              member_sha = sha(archive.read(members[0]))
          assert sha(native.read_bytes()) == member_sha
          record = {"profile": os.environ["PROFILE"], "python": sys.version,
                    "executable": sys.executable, "prefix": sys.prefix,
                    "native": str(native), "native_sha256": member_sha,
                    "wheel": str(wheels[0]), "wheel_sha256": sha(wheels[0].read_bytes()),
                    "archive_member": members[0], "installed_bytes_match_fresh_wheel": True}
          (Path(os.environ["RECEIPTS"]) / "native-suite-runtime.json").write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record, indent=2))
          PY
          set +e
          uv run --no-sync --offline python -m pytest packages/pybammsolvers/tests --junitxml="$RECEIPTS/native-tests.xml" 2>&1 | tee "$RECEIPTS/native-tests.log"
          pybamm_pipeline_status=("${PIPESTATUS[@]}")
          printf '%s\n' "${pybamm_pipeline_status[0]}" > "$RECEIPTS/native-tests.exit"
          printf '%s\n' "${pybamm_pipeline_status[1]}" > "$RECEIPTS/native-tests-log.exit"
          if test "${pybamm_pipeline_status[0]}" -ne 0; then exit "${pybamm_pipeline_status[0]}"; fi
          exit "${pybamm_pipeline_status[1]}"

      - name: Run the actual full combined nox tests session
        id: tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/pybamm6037-main8ec-${{ matrix.profile }}-readiness/tests.xml
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git diff --exit-code HEAD --
          set +e
          uv run --no-sync --offline nox -s tests 2>&1 | tee "$RECEIPTS/tests.log"
          pybamm_pipeline_status=("${PIPESTATUS[@]}")
          pybamm_test_status=${pybamm_pipeline_status[0]}
          pybamm_log_status=${pybamm_pipeline_status[1]}
          printf '%s\n' "$pybamm_test_status" > "$RECEIPTS/tests.exit"
          date -u +%FT%TZ > "$RECEIPTS/tests-finished-at.txt"
          printf '%s\n' "$pybamm_log_status" > "$RECEIPTS/tests-log.exit"
          if test "$pybamm_test_status" -ne 0; then exit "$pybamm_test_status"; fi
          exit "$pybamm_log_status"

      - name: Run the actual nox doctests session after ordinary test failure
        id: doctests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/pybamm6037-main8ec-${{ matrix.profile }}-readiness/doctests.xml
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git diff --exit-code HEAD --
          set +e
          uv run --no-sync --offline nox -s doctests 2>&1 | tee "$RECEIPTS/doctests.log"
          pybamm_pipeline_status=("${PIPESTATUS[@]}")
          pybamm_doctest_status=${pybamm_pipeline_status[0]}
          pybamm_log_status=${pybamm_pipeline_status[1]}
          printf '%s\n' "$pybamm_doctest_status" > "$RECEIPTS/doctests.exit"
          date -u +%FT%TZ > "$RECEIPTS/doctests-finished-at.txt"
          printf '%s\n' "$pybamm_log_status" > "$RECEIPTS/doctests-log.exit"
          if test "$pybamm_doctest_status" -ne 0; then exit "$pybamm_doctest_status"; fi
          exit "$pybamm_log_status"

      - name: Verify session source imports, native wheel bytes and observed workers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cat > "$RECEIPTS/verify-runtime.py" <<'PY'
          import hashlib
          import importlib
          import importlib.metadata
          from email.parser import BytesParser
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import traceback
          import zipfile

          session = sys.argv[1]
          receipts = Path(os.environ["RECEIPTS"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          expected_env = workspace / ".nox" / session
          expected_executable = expected_env / "bin/python"
          record = {"session": session, "executable": sys.executable, "prefix": sys.prefix,
                    "expected_environment": str(expected_env), "expected_executable": str(expected_executable),
                    "python": sys.version}
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          try:
              assert Path(sys.prefix).resolve() == expected_env.resolve()
              assert Path(sys.executable).absolute() == expected_executable.absolute()
              assert sys.version_info[:3] == (3, 13, 18)
              head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
              assert head == os.environ["EXPECTED_HEAD"]
              assert tree == os.environ["EXPECTED_TREE"]
              native_tree = subprocess.check_output(["git", "rev-parse", "HEAD:packages/pybammsolvers"], text=True).strip()
              assert native_tree == os.environ["EXPECTED_NATIVE_TREE"]
              record.update(profile=os.environ["PROFILE"], head=head, tree=tree, native_tree=native_tree, modules={})
              record["versions"] = {name: importlib.metadata.version(name) for name in
                                    ["pybamm", "pybammsolvers", "numpy", "scipy", "casadi",
                                     "pillow", "tornado", "pytest"]}
              modules = ["pybamm", "pybamm.solvers.idaklu_solver",
                         "pybamm.models.full_battery_models.lithium_ion.electrode_soh",
                         "pybamm.models.full_battery_models.lithium_ion.electrode_soh_half_cell",
                         "pybamm.models.full_battery_models.lithium_ion.electrode_soh_composite"]
              if os.environ["PROFILE"] == "candidate-5033a965":
                  modules.append("pybamm.models.full_battery_models.lithium_ion.electrode_soh_algebraic_solver")
              else:
                  assert not (workspace / "packages/pybamm/src/pybamm/models/full_battery_models/lithium_ion/electrode_soh_algebraic_solver.py").exists()
              for name in modules:
                  path = Path(importlib.import_module(name).__file__).resolve()
                  assert path.is_relative_to(workspace / "packages/pybamm/src/pybamm")
                  relative = path.relative_to(workspace).as_posix()
                  committed = subprocess.check_output(["git", "show", "HEAD:" + relative])
                  assert sha(path.read_bytes()) == sha(committed)
                  record["modules"][name] = {"path": str(path), "sha256": sha(committed)}
              record["shared_sources"] = {}
              for relative in ["noxfile.py", "uv.lock", "pyproject.toml", ".pre-commit-config.yaml",
                               "packages/pybamm/pyproject.toml", "packages/pybammsolvers/pyproject.toml",
                               "packages/pybamm/tests/unit/test_citations.py",
                               "packages/pybamm/src/pybamm/citations.py",
                               "packages/pybamm/conftest.py", "packages/pybamm/tests/conftest.py"]:
                  path = workspace / relative
                  committed = subprocess.check_output(["git", "show", "HEAD:" + relative])
                  assert sha(path.read_bytes()) == sha(committed)
                  blob = subprocess.check_output(["git", "rev-parse", "HEAD:" + relative], text=True).strip()
                  record["shared_sources"][relative] = {"sha256": sha(committed), "git_blob": blob}
              from pybammsolvers import idaklu
              native = Path(idaklu.__file__).resolve()
              assert native.is_relative_to(expected_env.resolve())
              wheels = list(Path(os.environ["PYBAMM_SOLVER_WHEELS"]).glob("*-cp313-*.whl"))
              assert len(wheels) == 1
              wheel = wheels[0]
              with zipfile.ZipFile(wheel) as archive:
                  members = [name for name in archive.namelist()
                             if name.startswith("pybammsolvers/") and name.endswith("/" + native.name)]
                  assert len(members) == 1
                  member_sha = sha(archive.read(members[0]))
                  metadata_members = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
                  assert len(metadata_members) == 1
                  wheel_metadata = BytesParser().parsebytes(archive.read(metadata_members[0]))
                  assert wheel_metadata["Name"] == "pybammsolvers"
                  assert wheel_metadata["Version"] == record["versions"]["pybammsolvers"]
              native_sha = sha(native.read_bytes())
              assert native_sha == member_sha
              record["native"] = {"path": str(native), "sha256": native_sha,
                                  "wheel": str(wheel), "wheel_sha256": sha(wheel.read_bytes()),
                                  "archive_member": members[0], "archive_member_sha256": member_sha,
                                  "wheel_version": wheel_metadata["Version"],
                                  "installed_bytes_match_fresh_wheel": True}
              record["passed"] = True
          except Exception:
              record["passed"] = False
              record["error"] = traceback.format_exc()
          (receipts / (session + "-runtime.json")).write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record, indent=2))
          raise SystemExit(0 if record["passed"] else 1)
          PY
          set +e
          pybamm_runtime_status=0
          for pybamm_session in tests doctests; do
            pybamm_session_env="$GITHUB_WORKSPACE/.nox/$pybamm_session"
            UV_PROJECT_ENVIRONMENT="$pybamm_session_env" uv run --no-sync --offline --python "$pybamm_session_env/bin/python" python "$RECEIPTS/verify-runtime.py" "$pybamm_session" 2>&1 | tee "$RECEIPTS/$pybamm_session-runtime.log"
            pybamm_pipeline_status=("${PIPESTATUS[@]}")
            printf '%s\n' "${pybamm_pipeline_status[0]}" > "$RECEIPTS/$pybamm_session-runtime.exit"
            if test "${pybamm_pipeline_status[0]}" -ne 0 || test "${pybamm_pipeline_status[1]}" -ne 0; then
              pybamm_runtime_status=1
            fi
          done
          uv run --no-sync --offline python - "$RECEIPTS" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          import xml.etree.ElementTree as ET
          receipts = Path(sys.argv[1])
          result = {}
          for session in ["tests", "doctests"]:
              path = receipts / (session + ".log")
              text = path.read_text(errors="replace") if path.exists() else ""
              text = re.sub(r"\x1b\[[0-9;]*m", "", text)
              lines = [line for line in text.splitlines()
                       if re.match(r"^(?:created:\s*)?\d+(?:/\d+)? workers?\b", line)]
              entries = [{"line": line, "workers": int(re.search(r"\d+", line).group())}
                         for line in lines]
              item = {"observed_worker_lines": entries,
                      "worker_count_observed": bool(entries),
                      "note": "Log observations only; no worker/config override was applied."}
              xml = receipts / (session + ".xml")
              if xml.exists():
                  try:
                      root = ET.parse(xml).getroot()
                      item["junit_suites"] = [node.attrib for node in root.iter("testsuite")]
                      item["junit_testcase_elements"] = len(list(root.iter("testcase")))
                  except ET.ParseError as error:
                      item["junit_parse_error"] = str(error)
              result[session] = item
          (receipts / "observed-workers-and-junit.json").write_text(json.dumps(result, indent=2) + "\n")
          PY
          pybamm_worker_status=$?
          printf '%s\n' "$pybamm_worker_status" > "$RECEIPTS/worker-observation.exit"
          if test "$pybamm_worker_status" -ne 0; then pybamm_runtime_status=1; fi
          exit "$pybamm_runtime_status"


      - name: Run the actual all-files nox pre-commit session after ordinary failures
        id: precommit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git diff --exit-code HEAD --
          set +e
          uv run --no-sync --offline nox -s pre-commit 2>&1 | tee "$RECEIPTS/pre-commit.log"
          pybamm_pipeline_status=("${PIPESTATUS[@]}")
          pybamm_precommit_status=${pybamm_pipeline_status[0]}
          pybamm_log_status=${pybamm_pipeline_status[1]}
          printf '%s\n' "$pybamm_precommit_status" > "$RECEIPTS/pre-commit.exit"
          printf '%s\n' "$pybamm_log_status" > "$RECEIPTS/pre-commit-log.exit"
          date -u +%FT%TZ > "$RECEIPTS/pre-commit-finished-at.txt"
          if test "$pybamm_precommit_status" -ne 0; then exit "$pybamm_precommit_status"; fi
          exit "$pybamm_log_status"

      - name: Record all session environments and final source identity
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pybamm_provenance_status=0
          for pybamm_session in tests doctests pre-commit; do
            if test -x ".nox/$pybamm_session/bin/python"; then
              uv pip list --python ".nox/$pybamm_session/bin/python" --format json > "$RECEIPTS/$pybamm_session-packages.json" || pybamm_provenance_status=1
            else
              printf 'Session environment missing: %s\n' "$pybamm_session" > "$RECEIPTS/$pybamm_session-environment-missing.txt"
              pybamm_provenance_status=1
            fi
            if ! test -s "$RECEIPTS/$pybamm_session.exit"; then
              printf 'Terminal exit receipt missing: %s\n' "$pybamm_session" > "$RECEIPTS/$pybamm_session-exit-missing.txt"
              pybamm_provenance_status=1
            fi
          done
          git rev-parse HEAD 'HEAD^{tree}' HEAD:packages/pybammsolvers > "$RECEIPTS/final-source-identity.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || pybamm_provenance_status=1
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE" || pybamm_provenance_status=1
          git diff --binary HEAD -- > "$RECEIPTS/final-source-diff.patch"
          git diff --exit-code HEAD -- || pybamm_provenance_status=1
          date -u +%FT%TZ > "$RECEIPTS/finished-at.txt"
          printf '%s\n' "$pybamm_provenance_status" > "$RECEIPTS/provenance.exit"
          exit "$pybamm_provenance_status"

      - name: Upload exact-head verification receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pybamm-6037-main8ec-${{ matrix.profile }}-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pybamm6037-main8ec-${{ matrix.profile }}-readiness/
          if-no-files-found: error
          retention-days: 14
